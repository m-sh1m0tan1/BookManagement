<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本の一覧 - 共有図書貸出管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="inner">
        <h1 class="site-title">共有図書貸出管理</h1>
        <nav class="site-nav" aria-label="メインメニュー">
            <a href="/books.html" aria-current="page">本を探す</a>
            <a href="/loans.html">自分の貸出</a>
            <a href="/admin.html" id="admin-link" hidden>管理</a>
            <button type="button" id="logout-button" class="secondary small">ログアウト</button>
        </nav>
    </div>
</header>

<main>
    <h2>本を探す</h2>
    <p id="message" class="message" role="alert"></p>

    <form id="search-form" class="card inline-form" role="search">
        <div class="field">
            <label for="keyword">キーワード（書名・著者）</label>
            <input type="search" id="keyword" name="keyword">
        </div>
        <label class="check">
            <input type="checkbox" id="available-only" name="availableOnly">
            貸出可能な本のみ
        </label>
        <button type="submit">検索</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>書名</th>
                <th>著者</th>
                <th>ISBN</th>
                <th class="num">所蔵数</th>
                <th>状態</th>
                <th><span class="visually-hidden">操作</span></th>
            </tr>
            </thead>
            <tbody id="book-list" aria-live="polite">
            <tr>
                <td class="empty" colspan="6">読み込み中...</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<dialog id="book-detail" aria-labelledby="book-detail-title">
    <h3 id="book-detail-title">本の詳細</h3>
    <dl class="detail">
        <dt>書名</dt>
        <dd id="detail-name"></dd>
        <dt>著者</dt>
        <dd id="detail-author"></dd>
        <dt>ISBN</dt>
        <dd id="detail-isbn"></dd>
        <dt>所蔵数</dt>
        <dd id="detail-quantity"></dd>
        <dt>状態</dt>
        <dd id="detail-status"></dd>
    </dl>
    <div class="actions">
        <button type="button" id="detail-borrow">借りる（返却期限は14日後）</button>
        <button type="button" id="detail-close" class="secondary">閉じる</button>
    </div>
</dialog>
<script src="/js/api.js"></script>
<script src="/js/books.js"></script>
</body>
</html>
