<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン - 共有図書貸出管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="inner">
        <h1 class="site-title">共有図書貸出管理</h1>
    </div>
</header>

<main class="auth-main">
    <p class="lead">ログインするか、はじめての方はアカウントを登録してください。</p>
    <p id="message" class="message" role="alert"></p>

    <div class="card-grid">
        <section class="card" aria-labelledby="login-heading">
            <h2 id="login-heading">ログイン</h2>
            <form id="login-form" novalidate>
                <div class="field">
                    <label for="login-mail">メールアドレス</label>
                    <input type="email" id="login-mail" name="mail" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="login-password">パスワード</label>
                    <input type="password" id="login-password" name="plainPassword" autocomplete="current-password" required>
                </div>
                <button type="submit">ログイン</button>
            </form>
        </section>

        <section class="card" aria-labelledby="register-heading">
            <h2 id="register-heading">新規登録</h2>
            <form id="register-form" novalidate>
                <div class="field">
                    <label for="register-mail">メールアドレス</label>
                    <input type="email" id="register-mail" name="mail" autocomplete="email" required>
                    <p class="hint">登録済みのメールアドレスは使えません。</p>
                </div>
                <div class="field">
                    <label for="register-name">表示名</label>
                    <input type="text" id="register-name" name="name" autocomplete="nickname" required>
                </div>
                <div class="field">
                    <label for="register-password">パスワード</label>
                    <input type="password" id="register-password" name="plainPassword" autocomplete="new-password" required>
                </div>
                <button type="submit">登録してログイン</button>
            </form>
        </section>
    </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
