<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理 - 共有図書貸出管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="inner">
        <h1 class="site-title">共有図書貸出管理</h1>
        <nav class="site-nav" aria-label="メインメニュー">
            <a href="/books.html">本を探す</a>
            <a href="/loans.html">自分の貸出</a>
            <a href="/admin.html" aria-current="page">管理</a>
            <button type="button" id="logout-button" class="secondary small">ログアウト</button>
        </nav>
    </div>
</header>

<main>
    <h2>管理</h2>
    <p id="message" class="message" role="alert"></p>

    <section class="card" aria-labelledby="book-form-heading">
        <h3 id="book-form-heading">本の登録・編集</h3>
        <form id="book-form" novalidate>
            <input type="hidden" id="book-id" name="id">
            <div class="field">
                <label for="book-name">書名（必須）</label>
                <input type="text" id="book-name" name="name" required>
            </div>
            <div class="field">
                <label for="book-author">著者（必須）</label>
                <input type="text" id="book-author" name="author" required>
            </div>
            <div class="field">
                <label for="book-isbn">ISBN（任意）</label>
                <input type="text" id="book-isbn" name="isbn">
            </div>
            <div class="field">
                <label for="book-quantity">所蔵数</label>
                <input type="number" id="book-quantity" name="quantity" min="0" step="1" value="1" required>
                <p class="hint">未返却の貸出数より少なくもできます。その間は新しい貸出ができません。</p>
            </div>
            <div class="actions">
                <button type="submit" id="book-submit">登録する</button>
                <button type="button" id="book-reset" class="secondary">入力をクリア</button>
            </div>
        </form>
    </section>

    <h3>本の一覧</h3>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>書名</th>
                <th>著者</th>
                <th>ISBN</th>
                <th class="num">所蔵数</th>
                <th><span class="visually-hidden">操作</span></th>
            </tr>
            </thead>
            <tbody id="admin-book-list" aria-live="polite">
            <tr>
                <td class="empty" colspan="6">読み込み中...</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h3 class="section-gap">全体の貸出状況</h3>
    <div class="card inline-form">
        <label class="check">
            <input type="checkbox" id="overdue-only">
            延滞中のみ表示
        </label>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>利用者</th>
                <th>書名</th>
                <th>貸出日</th>
                <th>返却期限</th>
                <th>返却日</th>
                <th>状態</th>
            </tr>
            </thead>
            <tbody id="admin-loan-list" aria-live="polite">
            <tr>
                <td class="empty" colspan="6">読み込み中...</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
